name: Apply Skills Academy v3.4.8 XP boost

on:
  push:
    paths:
      - '.github/workflows/boost-xp-v348.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch index, manifest and service worker
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          html = p.read_text(encoding='utf-8')

          html = html.replace('v3.4.7', 'v3.4.8').replace('3.4.7', '3.4.8').replace('347', '348')

          needle = '    const APP_VERSION = "3.4.8";\n'
          repl = '''    const APP_VERSION = "3.4.8";
              const XP_MULTIPLIER = 1.15;
              function boostXp(value){ return Math.round((Number(value)||0)*XP_MULTIPLIER); }
          '''
          assert needle in html
          html = html.replace(needle, repl, 1)

          needle = '''      state.sessions.unshift({id:uid("session"),profileId:state.activeProfileId,createdAt:new Date().toISOString(),goalType:goal.id,targetName:goal.name,gridSize:size,situation:$("analysisSituation").value,plan:[...analysisPlan],shots:analysisShots.map(s=>({...s})),total:analysisShots.length,hits,exact,near,hitPercentage:analysisShots.length?hits/analysisShots.length:0,accuracy:analysisShots.length?exact/analysisShots.length:0});'''
          repl = '''      const xpAwarded=boostXp(120+analysisShots.length*2+exact*8+near*3);
              state.sessions.unshift({id:uid("session"),profileId:state.activeProfileId,createdAt:new Date().toISOString(),goalType:goal.id,targetName:goal.name,gridSize:size,situation:$("analysisSituation").value,plan:[...analysisPlan],shots:analysisShots.map(s=>({...s})),total:analysisShots.length,hits,exact,near,hitPercentage:analysisShots.length?hits/analysisShots.length:0,accuracy:analysisShots.length?exact/analysisShots.length:0,xpAwarded});'''
          assert needle in html
          html = html.replace(needle, repl, 1)

          needle = '        xpAwarded:Math.min(75,20+Math.round((p.correct||0)*3)+(p.profileId===challenge.winnerId?20:0))'
          repl = '        xpAwarded:boostXp(Math.min(75,20+Math.round((p.correct||0)*3)+(p.profileId===challenge.winnerId?20:0)))'
          assert needle in html
          html = html.replace(needle, repl, 1)

          needle = '      const already=miniCompleted(type); const xp=already?0:(type==="mini1"?150:250);'
          repl = '      const already=miniCompleted(type); const xp=already?0:boostXp(type==="mini1"?150:250);'
          assert needle in html
          html = html.replace(needle, repl, 1)

          needle = '      let xp=passed&&!wasPassed?level.exerciseXp:10;'
          repl = '      let xp=boostXp(passed&&!wasPassed?level.exerciseXp:10);'
          assert needle in html
          html = html.replace(needle, repl, 1)

          needle = '      if(completedAfter&&!completedBefore){ state.footballBadgeResults.push({id:uid("badge"),profileId:state.activeProfileId,type:"technique",level:badgeLevel,exerciseId:"complete",value:1,passed:true,verified:true,xpAwarded:level.bonusXp,createdAt:new Date().toISOString()}); xp+=level.bonusXp; }'
          repl = '      if(completedAfter&&!completedBefore){ const completionXp=boostXp(level.bonusXp); state.footballBadgeResults.push({id:uid("badge"),profileId:state.activeProfileId,type:"technique",level:badgeLevel,exerciseId:"complete",value:1,passed:true,verified:true,xpAwarded:completionXp,createdAt:new Date().toISOString()}); xp+=completionXp; }'
          assert needle in html
          html = html.replace(needle, repl, 1)

          assert html.count('const xp=skillTimeXp(minutes)+bonus;') == 2
          html = html.replace('const xp=skillTimeXp(minutes)+bonus;', 'const xp=boostXp(skillTimeXp(minutes)+bonus);')

          assert html.count('const xp=dribbleTimeXp(minutes)+bonus;') == 2
          html = html.replace('const xp=dribbleTimeXp(minutes)+bonus;', 'const xp=boostXp(dribbleTimeXp(minutes)+bonus);')

          assert html.count('const xp=baseXp+recordInfo.bonus;') == 2
          html = html.replace('const xp=baseXp+recordInfo.bonus;', 'const xp=boostXp(baseXp+recordInfo.bonus);')

          needle = '    function calculateLagspillXp(minutes){return Math.round(minutes*(selectedOtherActivity==="camp"?1:3.5));}'
          repl = '    function calculateLagspillXp(minutes){return boostXp(minutes*(selectedOtherActivity==="camp"?1:3.5));}'
          assert needle in html
          html = html.replace(needle, repl, 1)

          html = html.replace('XP = 3,5 per minutt + bonus ved ny personlig rekord.', 'XP ≈ 4,0 per minutt + bonus ved ny personlig rekord.')
          html = html.replace("'XP = 3,5 per minutt. Bonus gis bare ved ny personlig rekord.'", "'XP ≈ 4,0 per minutt. Bonus gis bare ved ny personlig rekord.'")
          html = html.replace("'XP = 4,0 per minutt. Bonus gis bare ved ny personlig rekord.'", "'XP = 4,6 per minutt. Bonus gis bare ved ny personlig rekord.'")
          html = html.replace('"3,5 XP per minutt. Bonus gis ved ny personlig rekord.")', '"Ca. 4,0 XP per minutt. Bonus gis ved ny personlig rekord.")')
          html = html.replace(':"3,54 XP per minutt. Denne øvelsen har ingen rekord.";', ':"Ca. 4,1 XP per minutt. Denne øvelsen har ingen rekord.";')
          html = html.replace('?"XP = 1 XP per minutt. Treningsleir kan registreres med opptil 600 minutter."\n        :"XP = 3,5 XP per minutt. Maks 180 minutter per registrering. Lagspill påvirker samlet XP og EXP.";', '?"XP = 1,15 XP per minutt. Treningsleir kan registreres med opptil 600 minutter."\n        :"XP ≈ 4,0 XP per minutt. Maks 180 minutter per registrering. Lagspill påvirker samlet XP og EXP.";')

          needle = '      const calculatedXp=Math.round(sessions.length*120+totalShots*2+exact*8+near*3+legacyChallengeXp+modernChallengeXp+badgeXp+skillXp+otherXp+customExerciseXp);'
          repl = '''      const legacySessions=sessions.filter(x=>!Number.isFinite(Number(x.xpAwarded)));
              const legacySessionShots=legacySessions.reduce((sum,x)=>sum+sessionTotal(x),0);
              const legacySessionExact=legacySessions.reduce((sum,x)=>sum+sessionExact(x),0);
              const legacySessionNear=legacySessions.reduce((sum,x)=>sum+sessionNear(x),0);
              const legacySessionXp=Math.round(legacySessions.length*120+legacySessionShots*2+legacySessionExact*8+legacySessionNear*3);
              const modernSessionXp=sessions.reduce((sum,x)=>sum+(Number.isFinite(Number(x.xpAwarded))?Number(x.xpAwarded):0),0);
              const calculatedXp=Math.round(legacySessionXp+modernSessionXp+legacyChallengeXp+modernChallengeXp+badgeXp+skillXp+otherXp+customExerciseXp);'''
          assert needle in html
          html = html.replace(needle, repl, 1)

          p.write_text(html, encoding='utf-8')

          Path('manifest.webmanifest').write_text('''{
            "name": "Skills Academy v3.4.8",
            "short_name": "Academy",
            "description": "Skills Academy v3.4.8",
            "id": "/football-skills/",
            "start_url": "./index.html?v=3.4.8",
            "scope": "./",
            "display": "standalone",
            "background_color": "#06100d",
            "theme_color": "#07130f",
            "orientation": "portrait-primary",
            "icons": [
              {"src":"icon-192.png","sizes":"192x192","type":"image/png","purpose":"any maskable"},
              {"src":"icon-512.png","sizes":"512x512","type":"image/png","purpose":"any maskable"}
            ]
          }
          ''', encoding='utf-8')

          Path('service-worker.js').write_text('''const CACHE_NAME="skills-academy-v3-4-8";
          const APP_FILES=["./","./index.html?v=3.4.8","./manifest.webmanifest","./icon-192.png","./icon-512.png"];
          self.addEventListener("install",e=>{self.skipWaiting();e.waitUntil(caches.open(CACHE_NAME).then(c=>c.addAll(APP_FILES)))});
          self.addEventListener("activate",e=>{e.waitUntil(caches.keys().then(k=>Promise.all(k.filter(x=>x!==CACHE_NAME).map(x=>caches.delete(x)))).then(()=>self.clients.claim()))});
          self.addEventListener("message",e=>{if(e.data&&e.data.type==="SKIP_WAITING")self.skipWaiting()});
          self.addEventListener("fetch",e=>{if(e.request.method!=="GET")return;if(e.request.mode==="navigate"){e.respondWith(fetch(e.request,{cache:"no-store"}).catch(()=>caches.match("./index.html?v=3.4.8")));return}e.respondWith(caches.match(e.request).then(c=>c||fetch(e.request)))});
          ''', encoding='utf-8')
          PY

          rm -f .github/workflows/boost-xp-v348.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html manifest.webmanifest service-worker.js .github/workflows/boost-xp-v348.yml
          git commit -m "Skills Academy v3.4.8: increase new XP rewards by 15 percent"
          git push
